<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ModelPulse · AI model leaks & launches, first</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0e1014;
      --card: #181B20;
      --card-2: #292D34;
      --line: #414750;
      --line-2: #525965;
      --text: #FFFFFF;
      --text-2: #F4F6FA;
      --muted: #A4ADB9;
      --blue: #B9D5F5;
      --leak: #fce081;
      --release: #22c55e;
      --open: #a78bfa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
      min-height: 100vh;
      padding-bottom: 60px;
    }
    /* Full-screen tiled @StatsWire watermark overlay */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 40;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='125'><text x='14' y='72' transform='rotate(-22 110 62)' font-family='Inter,Segoe UI,Arial,sans-serif' font-size='15' font-weight='700' fill='%23ffffff' fill-opacity='0.025'>@StatsWire</text></svg>");
      background-repeat: repeat;
    }
    a { color: var(--blue); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

    .navbar {
      position: sticky; top: 0; z-index: 50;
      background: rgba(11, 13, 17, 0.9); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line); padding: 12px 24px;
    }
    .nav-inner, .container { max-width: 1180px; margin: 0 auto; }
    .nav-inner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-title { font-size: 1.2rem; font-weight: 800; letter-spacing: -0.02em; }
    .brand-tag { font-size: 0.85rem; color: var(--muted); }
    .status {
      display: inline-flex; align-items: center; gap: 8px; font-size: 0.8rem; color: var(--text-2);
      border: 1px solid var(--line-2); border-radius: 999px; padding: 4px 11px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--release); box-shadow: 0 0 8px var(--release); }
    .dot.stale { background: var(--leak); box-shadow: 0 0 8px var(--leak); }
    .nav-actions { display: flex; gap: 8px; align-items: center; }

    .btn {
      display: inline-flex; align-items: center; gap: 6px; font-size: 0.82rem; font-weight: 600;
      padding: 7px 13px; border-radius: 8px; border: 1px solid var(--line-2);
      background: var(--card); color: var(--text); cursor: pointer; text-decoration: none;
    }
    .btn:hover { background: var(--card-2); text-decoration: none; }
    .btn-primary { background: #2563eb; border-color: #3b82f6; color: #fff; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-sm { font-size: 0.76rem; padding: 5px 10px; border-radius: 6px; }

    .container { margin-top: 22px; padding: 0 24px; }
    .summary { color: var(--muted); font-size: 0.9rem; margin-bottom: 16px; }
    .summary b { color: var(--text); }

    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .tabs { display: flex; flex-wrap: wrap; gap: 6px; }
    .tab {
      font-size: 0.84rem; font-weight: 600; padding: 6px 13px; border-radius: 999px;
      border: 1px solid var(--line); background: var(--card); color: var(--text-2); cursor: pointer;
    }
    .tab:hover { color: #fff; border-color: var(--line-2); }
    .tab.active { background: var(--text); color: #0b0d11; border-color: var(--text); }
    .tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    select, input[type="search"] {
      background: var(--bg); color: var(--text); border: 1px solid var(--line-2);
      border-radius: 8px; padding: 7px 11px; font-size: 0.85rem; outline: none;
    }
    input[type="search"] { min-width: 240px; }
    select:focus, input:focus { border-color: var(--blue); }

    .feed { display: grid; grid-template-columns: repeat(auto-fill, minmax(520px, 1fr)); gap: 20px; align-items: start; }
    @media (max-width: 620px) { .feed { grid-template-columns: 1fr; } input[type="search"] { min-width: 0; width: 100%; } }

    .story {
      position: relative;
      background: #000000;
      border: 1px solid #282c34;
      border-left: 5px solid #ffffff;
      border-radius: 14px;
      padding: 20px 22px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 14px 32px -8px rgba(0, 0, 0, 0.65);
      transition: border-color 0.15s ease, transform 0.15s ease;
    }
    .story:hover {
      border-color: #525866;
      border-left-color: #ffffff;
    }
    /* Tiled credit so screenshots of a card always carry it */
    .story::before {
      content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='210' height='118'><text x='14' y='68' transform='rotate(-22 105 59)' font-family='Inter,Segoe UI,Arial,sans-serif' font-size='15' font-weight='700' fill='%23ffffff' fill-opacity='0.028'>@StatsWire</text></svg>");
    }
    .story > * { position: relative; }
    .site-foot { max-width: 1180px; margin: 36px auto 28px; padding: 18px 24px 0; border-top: 1px solid var(--line); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; font-size: 0.86rem; color: var(--muted); }
    .site-foot a { color: var(--text); font-weight: 700; text-decoration: none; }
    .embed-body {
      display: flex; justify-content: space-between; align-items: flex-start; gap: 18px;
    }
    .embed-main {
      flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 11px;
    }
    .embed-author {
      display: flex; align-items: center; gap: 9px;
      font-size: 18px; font-weight: 600; color: #FFFFFF; line-height: 1.3;
    }
    .embed-author a { color: #FFFFFF; text-decoration: none; }
    .embed-author a:hover { color: #B9D5F5; text-decoration: underline; }
    .author-icon {
      width: 24px; height: 24px; border-radius: 50%; overflow: hidden; flex-shrink: 0;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .author-icon svg { width: 24px; height: 24px; display: block; }
    .embed-thumb {
      width: 74px; height: 74px; border-radius: 16px; overflow: hidden; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
    }
    .embed-thumb svg { width: 74px; height: 74px; display: block; }
    .embed-counts {
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
      font-size: 15px; font-weight: 600; color: #FFFFFF;
    }
    .new-badge {
      display: inline-flex; align-items: center; justify-content: center;
      background: #5865f2; color: #ffffff; font-size: 10px; font-weight: 800;
      padding: 2px 6px; border-radius: 4px; letter-spacing: 0.04em;
    }
    .new-badge.registry { background: #0284c7; }
    .new-badge.unverified { background: #64748b; }
    .stage-pill {
      font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 5px;
      background: rgba(252, 224, 129, 0.16); color: #fce081; border: 1px solid rgba(252, 224, 129, 0.35);
    }
    .stage-pill.release {
      background: rgba(34, 197, 94, 0.16); color: #86efac; border-color: rgba(34, 197, 94, 0.35);
    }
    .stage-pill.registry {
      background: rgba(56, 189, 248, 0.16); color: #7dd3fc; border-color: rgba(56, 189, 248, 0.35);
    }
    .stage-pill.unverified {
      background: rgba(148, 163, 184, 0.18); color: #cbd5e1; border-color: rgba(148, 163, 184, 0.38);
    }
    .section-head {
      font-size: 15px; font-weight: 700; color: #FFFFFF; margin-top: 2px;
    }
    .embed-list {
      list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px;
    }
    .embed-list li {
      display: flex; flex-wrap: wrap; align-items: center; gap: 6px; row-gap: 4px;
      font-size: 13px; color: #dbdee1; line-height: 1.5;
    }
    .embed-list .dot-bullet {
      color: #FFFFFF; font-weight: 800; margin-right: 1px;
    }
    .chip, .chip.price {
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13.5px; font-weight: 500; background: #0a0b0e;
      border: 1px solid #2d313a; color: #F4F6FA;
      padding: 3px 9px; border-radius: 6px;
      white-space: nowrap;
    }
    .ts-inline {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 11.5px; color: #A4ADB9; white-space: nowrap;
    }
    .chip.ts {
      font-size: 11.5px; padding: 2px 7px; color: #cfd6e0;
    }
    .chip.uuid {
      font-size: 11.5px; padding: 2px 8px; letter-spacing: -0.01em;
    }
    .story { min-width: 0; }
    details summary { cursor: pointer; font-size: 12px; color: #A4ADB9; margin-top: 4px; }
    .foot {
      display: flex; justify-content: space-between; align-items: center;
      gap: 12px; flex-wrap: wrap; padding-top: 4px;
    }
    .credit-line {
      display: inline-flex; align-items: center; gap: 8px;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px; font-weight: 600; color: #FFFFFF;
    }
    .sw-badge {
      width: 26px; height: 26px; border-radius: 6px; border: 1px solid #3c414c;
      display: inline-block; flex-shrink: 0; background: #000000;
    }
    .foot-right { display: flex; align-items: center; gap: 10px; margin-left: auto; }
    .watermark-link {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px; font-weight: 600; color: #B9D5F5; text-decoration: none;
    }
    .watermark-link:hover { text-decoration: underline; }
    .actions { display: flex; gap: 6px; }
    .empty { grid-column: 1/-1; text-align: center; padding: 48px; color: var(--muted); }

    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.72); display: none; align-items: center; justify-content: center; z-index: 90; padding: 20px; }
    .modal.open { display: flex; }
    .modal-box { background: var(--card); border: 1px solid var(--line-2); border-radius: 12px; padding: 16px; max-width: 980px; width: 100%; max-height: calc(100dvh - 40px); overflow-y: auto; }
    .modal-box canvas { width: 100%; height: auto; border-radius: 8px; display: block; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; flex-wrap: wrap; }

    .toast {
      position: fixed; bottom: 24px; right: 24px; background: #22c55e; color: #052e16; font-weight: 700;
      padding: 11px 18px; border-radius: 8px; display: none; z-index: 100;
    }
  </style>
</head>

      xai: ["#18181b", "xAI"], qwen: ["#7c3aed", "QW"], deepseek: ["#0284c7", "DS"], meta: ["#0668E1", "∞"],
      mistral: ["#FA520F", "M"], cursor: ["#2563eb", "CU"], perplexity: ["#0ea5e9", "PX"],
      thinkingmachines: ["#8b5cf6", "TML"], microsoft: ["#0078d4", "MS"], azure: ["#0078d4", "AZ"],
      multi: ["#6366f1", "AI"],
    };
    function logoSvg(slug, name) {
      if (LOGOS[slug]) return LOGOS[slug];
      const [bg, txt] = BADGES[slug] || ["#3b82f6", (name || "AI").replace(/[^A-Za-z0-9]/g, "").slice(0, 2).toUpperCase() || "AI"];
      const fs = txt.length > 2 ? 15 : 19;
      return `<svg viewBox="0 0 48 48"><rect width="48" height="48" rx="12" fill="${bg}"/><text x="24" y="31" text-anchor="middle" fill="#ffffff" font-size="${fs}" font-weight="800" font-family="Inter, Segoe UI, Arial, sans-serif">${escapeHtml(txt)}</text></svg>`;
    }

    function escapeHtml(s) {
      return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function safeUrl(u) { return /^https?:\/\//i.test(u || "") ? u : ""; }
    function toast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg; t.style.display = "block";
      clearTimeout(toast._t); toast._t = setTimeout(() => { t.style.display = "none"; }, 2600);
    }
    const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    function fmtUTC(iso, withYear) {
      const d = new Date(iso);
      if (isNaN(d)) return "";
      const p = n => String(n).padStart(2, "0");
      return `${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]}${withYear ? " " + d.getUTCFullYear() : ""} · ${p(d.getUTCHours())}:${p(d.getUTCMinutes())} UTC`;
    }
    function ago(iso) {
      const m = Math.max(0, Math.round((Date.now() - new Date(iso)) / 60000));
      if (m < 60) return m <= 1 ? "just now" : `${m} min ago`;
      if (m < 48 * 60) return `${Math.round(m / 60)} h ago`;
      return `${Math.round(m / 1440)} d ago`;
    }
    const hoursAgo = iso => (Date.now() - new Date(iso)) / 3600000;
    const stageOf = s => {
      if (s.kind === "registry") return "registry";
      if (s.kind === "unverified") return "unverified";
      if (s.kind === "leak") return "leak";
      return s.open_weights ? "open" : "release";
    };
    const STAGE_LABEL = {
      leak: "LEAK",
      release: "NEW MODEL",
      open: "OPEN WEIGHTS",
      registry: "REGISTRY UPDATE",
      unverified: "UNVERIFIED",
    };

    // Older feeds (before story grouping) only have cards: show one story per card
    function storiesFromFeed(feed) {
      if (Array.isArray(feed.stories)) return feed.stories.filter(s => !String(s.id || "").startsWith("story-ct-"));
      return (feed.cards || []).filter(c => c.scanner !== "cert-transparency" && c.scanner !== "cert-transparency-snapshot" && c.category !== "subdomain-ct").map(c => ({
        id: "story-" + c.id, kind: "leak", open_weights: c.category === "open-source", title: c.title,
        provider_slug: c.provider_slug, provider_name: "", detected_at: c.detected_at, updated_at: c.detected_at,
        first_source: (c.header || "").split(" · ")[0], lead: "", codenames: c.codenames || [],
        models: (c.models || []).map(m => ({ id: m.id, name: m.name })), source_count: 1,
        sources: [{ label: (c.header || "").split(" · ")[0], detected_at: c.detected_at, url: (c.links || [])[0]?.url || "" }],
        x_post_text: c.x_post_text || c.title,
      }));
    }

    function getSeen() {
      try { const raw = localStorage.getItem(SEEN_KEY); return raw ? new Set(JSON.parse(raw)) : null; } catch { return null; }
    }
    function saveSeen(set) { try { localStorage.setItem(SEEN_KEY, JSON.stringify([...set])); } catch {} }
    function markAllRead() { saveSeen(new Set(STORIES.map(s => s.id))); render(); toast("All stories marked as read"); }

    function evidenceFor(s) {
      const cardIds = new Set(s.card_ids || [s.id.replace(/^story-/, "")]);
      return (FEED.cards || []).filter(card => cardIds.has(card.id));
    }
    function modelsFor(s) {
      const originals = evidenceFor(s).flatMap(card => card.models || []);
      return (s.models || []).map(model => {
        const labeled = originals.find(original => original.id === model.id && /\(M\d+\)/.test(original.name || ""));
        return labeled || model;
      });
    }
    function formatPricingText(raw) {
      return "";
    }
    function fmtIsoShort(iso) {
      const d = new Date(iso);
      if (isNaN(d)) return "";
      return d.toISOString().replace(/\.\d+Z$/, "Z");
    }
    function extractMintedTs(s) {
      for (const c of evidenceFor(s)) {
        const m = String(c.build_transition || "").match(/DB minted\s+([0-9-]+ [0-9:]+ UTC)/i);
        if (m) return m[1];
      }
      return "";
    }
    function modelBulletRows(models, story) {
      const sp = formatPricingText(story.pricing);
      const minted = extractMintedTs(story);
      const tsLabel = minted ? "minted" : (story.kind === "registry" ? "detected" : "spotted");
      const tsVal = minted || fmtIsoShort(story.detected_at);
      const isCkpt = models.some(m => m && m.uuid);
      if (isCkpt) {
        const rows = [];
        const first = models[0] || {};
        if (first.org || first.arena_provider) {
          const orgStr = first.org || "unknown";
          const provStr = first.arena_provider || "unknown";
          rows.push(`<li><span class="dot-bullet">•</span><span class="ts-inline">org <code class="chip mono">${escapeHtml(orgStr)}</code> · provider <code class="chip ts mono">${escapeHtml(provStr)}</code></span></li>`);
        }
        models.forEach((m, idx) => {
          if (!m.uuid) return;
          const lbl = models.length > 1 ? `ckpt ${String.fromCharCode(65 + idx)} ` : "new uuid ";
          const mintChip = m.minted_at ? `<span class="ts-inline">· minted <code class="chip ts mono">${escapeHtml(m.minted_at)}</code></span>` : "";
          rows.push(`<li><span class="dot-bullet">•</span><span class="ts-inline">${lbl}<code class="chip uuid mono">${escapeHtml(m.uuid)}</code></span>${mintChip}</li>`);
        });
        if (first.prev_uuid) {
          const prevMint = first.prev_minted_at ? `<span class="ts-inline">· minted <code class="chip ts mono">${escapeHtml(first.prev_minted_at)}</code></span>` : "";
          rows.push(`<li><span class="dot-bullet">•</span><span class="ts-inline">prev uuid <code class="chip ts uuid mono">${escapeHtml(first.prev_uuid)}</code></span>${prevMint}</li>`);
        }
        return rows.join("");
      }
      return models.map((model, i) => {
        const rawId = String(model.id || "");
        const id = (rawId.startsWith("org:") || rawId.includes(" · ")) ? String(model.name || rawId) : rawId.replace(/^(?:chatgpt|openai|anthropic|google|vertex_ai|bedrock|azure|dashscope)\//i, "");
        const relDate = String(model.released_on || "").trim();
        const relChip = relDate ? `<span class="ts-inline">· released <code class="chip ts mono">${escapeHtml(relDate)}</code></span>` : "";
        const tsChip = i === 0 && tsVal ? `<span class="ts-inline">· ${tsLabel} <code class="chip ts mono">${escapeHtml(tsVal)}</code></span>` : "";
        return `<li><span class="dot-bullet">•</span><code class="chip mono">${escapeHtml(id)}</code>${relChip}${tsChip}</li>`;
      }).join("");
    }

    function storyHtml(s, idx, seen) {
      const stage = stageOf(s);
      const models = modelsFor(s);
      const isCkpt = models.some(m => m && m.uuid);
      const ids = `<ul class="embed-list">${modelBulletRows(models.slice(0, 6), s)}</ul>`;
      const moreIds = models.length > 6 ? `<details><summary>+${models.length - 6} more models</summary><ul class="embed-list">${modelBulletRows(models.slice(6), s)}</ul></details>` : "";
      const srcs = s.sources || [];
      const primaryUrl = safeUrl((srcs[0] && srcs[0].url) || ((evidenceFor(s)[0]?.links || [])[0]?.url) || "");
      const headerLabel = (s.kind === "registry" || !s.provider_name)
        ? [s.title, s.first_source].filter(Boolean).join(" · ")
        : (s.provider_name === "AI Model Identifiers" || s.provider_slug === "multi")
          ? [s.provider_name, s.first_source].filter(Boolean).join(" · ")
          : [`${s.provider_name} models`, s.first_source].filter(Boolean).join(" · ");
      const headerEl = primaryUrl
        ? `<a href="${escapeHtml(primaryUrl)}" target="_blank" rel="noopener">${escapeHtml(headerLabel)}</a>`
        : `<span>${escapeHtml(headerLabel)}</span>`;
      const logo = logoSvg(s.provider_slug, s.provider_name);
      const badgeWord = stage === "registry" ? "UPDATE" : (stage === "unverified" ? "ALERT" : (isCkpt ? "CHECKPOINT" : "NEW"));
      const badgeClass = stage === "registry" ? "new-badge registry" : (stage === "unverified" ? "new-badge unverified" : "new-badge");
      const countText = isCkpt
        ? `${models.length || 1} ${(models.length || 1) === 1 ? "checkpoint" : "checkpoints"}`
        : (stage === "registry"
          ? `${models.length || 1} ${(models.length || 1) === 1 ? "entry" : "entries"} detected`
          : (stage === "unverified" ? `${models.length || 1} unverified` : `${models.length || 1} new`));
      const pillClass = stage === "leak" ? "leak" : (stage === "registry" ? "registry" : (stage === "unverified" ? "unverified" : "release"));
      const ckptSlot = isCkpt ? (models[0]?.host_slot || s.title || "") : "";
      const sectionHead = isCkpt
        ? `New checkpoint detected${ckptSlot ? ": " + escapeHtml(ckptSlot) : ""}`
        : (stage === "registry"
          ? "Existing models newly added to LiteLLM"
          : (stage === "unverified" ? "Unverified model identifiers" : "New models"));
      const relSummary = (stage === "registry" && s.released_on)
        ? `<span>·</span><span class="ts-inline">First released <code class="chip ts mono">${escapeHtml(s.released_on)}</code></span>`
        : "";
      return `
        <article class="story ${stage}">
          <div class="embed-body">
            <div class="embed-main">
              <div class="embed-author">
                <span class="author-icon">${logo}</span>
                ${headerEl}
              </div>
              <div class="embed-counts">
                <span class="${badgeClass}">${badgeWord}</span>
                <span>${countText}</span>
                <span>·</span>
                <span class="stage-pill ${pillClass}">${STAGE_LABEL[stage]}</span>
                ${relSummary}
              </div>
              <div class="section-head">${sectionHead}</div>
              ${ids}${moreIds}
            </div>
            <div class="embed-thumb">${logo}</div>
          </div>
          <div class="foot">
            <div class="credit-line"><img class="sw-badge" src="${STATSWIRE_LOGO_URI}" alt="StatsWire" /><span>Developed by <a class="watermark-link" href="https://x.com/StatsWire" target="_blank" rel="noopener">@StatsWire</a> on X</span></div>
            <div class="foot-right">
              <div class="actions">
                <button class="btn btn-sm" onclick="copyText(STORIES_VIEW[${idx}])">Copy X text</button>
                <button class="btn btn-sm btn-primary" onclick="openShare(${idx})">Share image</button>
              </div>
            </div>
          </div>
        </article>`;
    }

    let STORIES_VIEW = [];
    function render() {
      let seen = getSeen();
      if (!seen && STORIES.length) {  // first visit: only the last 24h counts as unread
        seen = new Set(STORIES.filter(s => hoursAgo(s.updated_at || s.detected_at) > 24).map(s => s.id));
        saveSeen(seen);
      }
      const prov = document.getElementById("provider").value;
      const q = document.getElementById("search").value.trim().toLowerCase();
      STORIES_VIEW = STORIES.filter(s => {
        if (TAB === "leak" && s.kind !== "leak") return false;
        if (TAB === "release" && s.kind !== "release") return false;
        if (TAB === "registry" && s.kind !== "registry") return false;
        if (TAB === "unverified" && s.kind !== "unverified") return false;
        if (TAB === "open" && !s.open_weights) return false;
        if (TAB === "unread" && (!seen || seen.has(s.id))) return false;
        if (prov && (s.provider_name || "Other") !== prov) return false;
        if (!q) return true;
        const hay = [s.title, s.provider_name, s.first_source, s.pricing, ...(s.codenames || []), ...modelsFor(s).flatMap(model => [model.id, model.name, model.pricing, model.uuid, model.prev_uuid, model.host_slot]), ...evidenceFor(s).map(card => card.build_transition), ...(s.sources || []).map(x => x.label)].join(" ").toLowerCase();
        return hay.includes(q);
      });
      const unread = seen ? STORIES.filter(s => !seen.has(s.id)).length : 0;
      document.getElementById("tab-unread").textContent = `Unread (${unread})`;
      const feedEl = document.getElementById("feed");
      feedEl.innerHTML = STORIES_VIEW.length
        ? STORIES_VIEW.map((s, i) => storyHtml(s, i, seen)).join("")
        : `<div class="empty">Nothing here yet.</div>`;
    }

    function renderChrome() {
      const leaks = STORIES.filter(s => s.kind === "leak").length;
      const releases = STORIES.filter(s => s.kind === "release").length;
      const regUpdates = STORIES.filter(s => s.kind === "registry").length;
      const unverified = STORIES.filter(s => s.kind === "unverified").length;
      const day = STORIES.filter(s => hoursAgo(s.updated_at || s.detected_at) <= 24).length;
      const srcCount = STORIES.reduce((n, s) => n + (s.sources || []).length, 0);
      document.getElementById("summary").innerHTML =
        `<b>${STORIES.length}</b> alerts tracked (last 21 days) · <b>${leaks}</b> leaks · <b>${releases}</b> new models · <b>${regUpdates}</b> registry updates · <b>${unverified}</b> unverified · <b>${day}</b> active in 24h · ${srcCount} source sightings merged`;
      const counts = {};
      STORIES.forEach(s => { const p = s.provider_name || "Other"; counts[p] = (counts[p] || 0) + 1; });
      const sel = document.getElementById("provider");
      const cur = sel.value;
      sel.innerHTML = `<option value="">All providers</option>` + Object.entries(counts).sort((a, b) => b[1] - a[1])
        .map(([p, n]) => `<option value="${escapeHtml(p)}">${escapeHtml(p)} (${n})</option>`).join("");
      sel.value = counts[cur] ? cur : "";
      renderStatus();
    }

    let HEARTBEAT = null;
    async function loadHeartbeat() {
      try {
        const r = await fetch("https://raw.githubusercontent.com/siddiquiamir/model-tracker/status/status.json?t=" + Date.now(), { cache: "no-store" });
        if (!r.ok) return false;
        const heartbeat = await r.json();
        if (!Number.isFinite(Date.parse(heartbeat.last_scan))) return false;
        if (!HEARTBEAT || Date.parse(heartbeat.last_scan) >= Date.parse(HEARTBEAT.last_scan)) HEARTBEAT = heartbeat;
        return true;
      } catch {
        return false;
      } finally {
        renderStatus();
      }
    }
    function latestScanTime() {
      return Math.max(Date.parse(HEARTBEAT?.last_scan) || 0, Date.parse(FEED.generated_at) || 0);
    }
    function renderStatus() {
      const hb = HEARTBEAT && HEARTBEAT.last_scan && new Date(HEARTBEAT.last_scan) > new Date(FEED.generated_at || 0) ? HEARTBEAT : null;
      const last = hb ? hb.last_scan : FEED.generated_at;
      if (!last) return;
      const mins = (Date.now() - new Date(last)) / 60000;
      document.getElementById("status-dot").className = "dot" + (mins > 15 ? " stale" : "");
      const n = hb ? hb.sources_ok : FEED.stats?.sources_ok;
      document.getElementById("status-text").textContent = `Last scan ${ago(last)}${n ? ` · ${n} sources ok` : ""}`;
      document.getElementById("status-text").title = `Recorded scan time: ${fmtUTC(last, true)}. Refresh checks for updates; it does not start a scan.`;
    }

    async function loadFeed() {
      const bust = Date.now();
      const urls = [
        "https://raw.githubusercontent.com/siddiquiamir/model-tracker/status/feed.json?t=" + bust,
        "https://raw.githubusercontent.com/siddiquiamir/model-tracker/main/docs/data/feed.json?t=" + bust,
        "./data/feed.json?t=" + bust,
      ];
      const results = await Promise.allSettled(urls.map(u => fetch(u, { cache: "no-store" }).then(r => r.ok ? r.json() : null)));
      const feeds = results.filter(r => r.status === "fulfilled" && r.value && (Array.isArray(r.value.stories) || Array.isArray(r.value.cards))).map(r => r.value);
      if (!feeds.length) return false;
      // Prefer a story-format feed, then the freshest one
      feeds.sort((a, b) => (!!b.stories - !!a.stories) || (new Date(b.generated_at || 0) - new Date(a.generated_at || 0)));
      FEED = feeds[0];
      STORIES = storiesFromFeed(FEED).sort((a, b) => new Date(b.detected_at) - new Date(a.detected_at));
      renderChrome();
      render();
      return true;
    }
    async function refreshFeed() {
      const btn = document.getElementById("refresh-btn");
      const previousScan = latestScanTime();
      btn.disabled = true;
      try {
        const [loaded, heartbeatLoaded] = await Promise.all([loadFeed(), loadHeartbeat()]);
        if (!loaded) toast("Refresh failed; showing the previous feed");
        else if (!heartbeatLoaded) toast("Feed refreshed; scan status unavailable");
        else toast(latestScanTime() > previousScan ? "Feed refreshed; newer scan found" : "Latest data checked; no newer scan yet");
      } catch {
        toast("Refresh failed; showing the previous feed");
      } finally {
        btn.disabled = false;
      }
    }

    function shareText(s) {
      const weight = text => Array.from(text).reduce((total, char) => total + (char.codePointAt(0) > 127 ? 2 : 1), 0);
      const tagMap = { leak: "LEAK", release: "NEW MODEL", registry: "REGISTRY UPDATE", unverified: "UNVERIFIED" };
      const tag = tagMap[s.kind] || "LEAK";
      const bySuffix = (s.provider_name && s.kind !== "registry") ? " by " + s.provider_name : "";
      let headline = `${tag}: ${s.title}${bySuffix}`;
      if (weight(headline) > 130) {
        const chars = Array.from(headline);
        while (weight(chars.join("")) > 127) chars.pop();
        headline = chars.join("") + "...";
      }
      const lines = [headline, `First detected ${fmtUTC(s.detected_at)}`];
      const credit = "Developed by @StatsWire on X";
      const sourceCount = (s.sources || []).length;
      const ckpts = (s.models || []).filter(m => m && m.uuid);
      const extras = [
        ckpts.length === 1 ? "New UUID: " + ckpts[0].uuid : (ckpts.length > 1 ? "UUIDs: " + ckpts.map(m => m.uuid.slice(0, 8)).join(", ") : ""),
        ckpts[0]?.prev_uuid ? "Prev UUID: " + ckpts[0].prev_uuid.slice(0, 8) : "",
        s.released_on ? "First released: " + s.released_on : "",
        s.first_source ? "Source: " + s.first_source : "",
        (s.codenames || []).length ? "Codename: " + s.codenames.join(", ") : "",
        `${sourceCount} source sighting${sourceCount === 1 ? "" : "s"}`,
        (!ckpts.length && (s.models || []).length) ? "IDs: " + s.models.map(model => model.id).join(", ") : "",
      ];
      for (const extra of extras.filter(Boolean)) {
        if (weight([...lines, extra, credit].join("\n")) <= 280) lines.push(extra);
      }
      return [...lines, credit].join("\n");
    }
    function copyText(s) {
      if (!s) return;
      navigator.clipboard.writeText(shareText(s)).then(() => toast("X post text copied"), () => toast("Clipboard blocked"));
    }

    let sharePending = false;
    async function openShare(idx) {
      if (sharePending) return;
      const story = STORIES_VIEW[idx];
      const card = document.querySelectorAll(".story")[idx];
      if (!story || !card) return;
      sharePending = true;
      try {
        await document.fonts.ready;
        const snapshot = await htmlToImage.toCanvas(card, {
          pixelRatio: 2,
          skipFonts: true,
          filter: node => !(node.classList && node.classList.contains("actions")),
        });
        const canvas = document.getElementById("share-canvas");
        canvas.width = snapshot.width; canvas.height = snapshot.height;
        canvas.getContext("2d").drawImage(snapshot, 0, 0);
        canvas.style.maxWidth = snapshot.width / 2 + "px";
        canvas.style.margin = "0 auto";
        SHARE_STORY = story;
        document.getElementById("modal").classList.add("open");
      } catch {
        toast("Could not capture this card. Please try again.");
      } finally {
        sharePending = false;
      }
    }
    function closeShare() { document.getElementById("modal").classList.remove("open"); }
    function shareFileName() { return `ModelPulse-${String(SHARE_STORY?.title || "model").replace(/[^a-zA-Z0-9._-]+/g, "-")}.png`; }
    function downloadShare() {
      const a = document.createElement("a");
      a.download = shareFileName();
      a.href = document.getElementById("share-canvas").toDataURL("image/png");
      a.click();
    }
    async function copyShareImage() {
      try {
        const blob = await new Promise(r => document.getElementById("share-canvas").toBlob(r, "image/png"));
        await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
        toast("Image copied: paste it into X");
      } catch (e) {
        toast("Clipboard image not supported here: use Download PNG");
      }
    }

    document.getElementById("tabs").addEventListener("click", e => {
      const btn = e.target.closest(".tab");
      if (!btn) return;
      TAB = btn.dataset.tab;
      document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t === btn));
      render();
    });
    document.getElementById("provider").addEventListener("change", render);
    document.getElementById("search").addEventListener("input", render);
    document.addEventListener("keydown", e => { if (e.key === "Escape") closeShare(); });
    setInterval(renderStatus, 30000);
    setInterval(loadHeartbeat, 60000);
    setInterval(loadFeed, 60000);
    loadFeed().then(loadHeartbeat);
  </script>
</body>
