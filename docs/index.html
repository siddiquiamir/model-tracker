<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ModelPulse · AI model leaks & launches, first</title>
  <style>
    :root {
      --bg: #0b0d11;
      --card: #14171e;
      --card-2: #1a1e27;
      --line: #252a35;
      --line-2: #323948;
      --text: #f1f5f9;
      --text-2: #cbd5e1;
      --muted: #8b95a7;
      --blue: #3898ff;
      --leak: #f59e0b;
      --release: #22c55e;
      --open: #a78bfa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
      min-height: 100vh;
      padding-bottom: 60px;
    }
    a { color: var(--blue); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

    .navbar {
      position: sticky; top: 0; z-index: 50;
      background: rgba(11, 13, 17, 0.9); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line); padding: 12px 24px;
    }
    .nav-inner, .container { max-width: 1180px; margin: 0 auto; }
    .nav-inner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-title { font-size: 1.2rem; font-weight: 800; letter-spacing: -0.02em; }
    .brand-tag { font-size: 0.85rem; color: var(--muted); }
    .status {
      display: inline-flex; align-items: center; gap: 8px; font-size: 0.8rem; color: var(--text-2);
      border: 1px solid var(--line-2); border-radius: 999px; padding: 4px 11px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--release); box-shadow: 0 0 8px var(--release); }
    .dot.stale { background: var(--leak); box-shadow: 0 0 8px var(--leak); }
    .nav-actions { display: flex; gap: 8px; align-items: center; }

    .btn {
      display: inline-flex; align-items: center; gap: 6px; font-size: 0.82rem; font-weight: 600;
      padding: 7px 13px; border-radius: 8px; border: 1px solid var(--line-2);
      background: var(--card); color: var(--text); cursor: pointer; text-decoration: none;
    }
    .btn:hover { background: var(--card-2); text-decoration: none; }
    .btn-primary { background: #2563eb; border-color: #3b82f6; color: #fff; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-sm { font-size: 0.76rem; padding: 5px 10px; border-radius: 6px; }

    .container { margin-top: 22px; padding: 0 24px; }
    .summary { color: var(--muted); font-size: 0.9rem; margin-bottom: 16px; }
    .summary b { color: var(--text); }

    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .tabs { display: flex; flex-wrap: wrap; gap: 6px; }
    .tab {
      font-size: 0.84rem; font-weight: 600; padding: 6px 13px; border-radius: 999px;
      border: 1px solid var(--line); background: var(--card); color: var(--text-2); cursor: pointer;
    }
    .tab:hover { color: #fff; border-color: var(--line-2); }
    .tab.active { background: var(--text); color: #0b0d11; border-color: var(--text); }
    .tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    select, input[type="search"] {
      background: var(--bg); color: var(--text); border: 1px solid var(--line-2);
      border-radius: 8px; padding: 7px 11px; font-size: 0.85rem; outline: none;
    }
    input[type="search"] { min-width: 240px; }
    select:focus, input:focus { border-color: var(--blue); }

    .feed { display: grid; grid-template-columns: repeat(auto-fill, minmax(500px, 1fr)); gap: 16px; align-items: start; }
    @media (max-width: 620px) { .feed { grid-template-columns: 1fr; } input[type="search"] { min-width: 0; width: 100%; } }

    .story {
      position: relative; background: var(--card); border: 1px solid var(--line);
      border-top: 3px solid var(--release); border-radius: 10px; padding: 18px 20px 14px;
      display: flex; flex-direction: column; gap: 12px;
    }
    /* Tiled credit so screenshots of a card always carry it */
    .story::before {
      content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='120'><text x='10' y='70' transform='rotate(-22 110 60)' font-family='Segoe UI,Arial,sans-serif' font-size='17' font-weight='700' fill='%23ffffff' fill-opacity='0.07'>@StatsWire</text></svg>");
    }
    .story > * { position: relative; }
    .credit { font-size: 0.78rem; color: var(--muted); }
    .credit a { color: var(--text-2); font-weight: 700; text-decoration: none; }
    .site-foot { max-width: 1180px; margin: 36px auto 28px; padding: 18px 24px 0; border-top: 1px solid var(--line); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; font-size: 0.86rem; color: var(--muted); }
    .site-foot a { color: var(--text); font-weight: 700; text-decoration: none; }
    .story.leak { border-top-color: var(--leak); }
    .story.open { border-top-color: var(--open); }
    .story.unread { box-shadow: 0 0 0 1px rgba(245, 158, 11, 0.35); }
    .head { display: flex; gap: 14px; align-items: flex-start; }
    .logo { width: 46px; height: 46px; flex-shrink: 0; }
    .logo svg { width: 46px; height: 46px; }
    .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 0.78rem; color: var(--muted); }
    .stage { font-weight: 800; letter-spacing: 0.06em; font-size: 0.7rem; padding: 2px 8px; border-radius: 999px; }
    .stage.leak { background: rgba(245, 158, 11, 0.16); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.4); }
    .stage.release { background: rgba(34, 197, 94, 0.14); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.4); }
    .stage.open { background: rgba(167, 139, 250, 0.14); color: #c4b5fd; border: 1px solid rgba(167, 139, 250, 0.4); }
    .new-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--leak); }
    .title { font-size: 1.3rem; font-weight: 750; line-height: 1.25; margin-top: 3px; word-break: break-word; }
    .first { font-size: 0.86rem; color: var(--text-2); margin-top: 3px; }
    .lead { display: inline-block; font-size: 0.8rem; font-weight: 700; color: #4ade80; margin-top: 4px; }
    .codenames { display: flex; gap: 6px; flex-wrap: wrap; }
    .codename { font-size: 0.7rem; font-weight: 800; letter-spacing: 0.05em; padding: 2px 8px; border-radius: 999px; color: #1a1205; background: #fbbf24; text-transform: uppercase; }
    .ids { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { font-size: 0.78rem; background: #1f2430; border: 1px solid var(--line-2); color: #e2e8f0; padding: 2px 7px; border-radius: 5px; }
    .chip.more { color: var(--muted); }
    .sources { list-style: none; border-left: 2px solid var(--line-2); margin-left: 4px; padding-left: 12px; display: flex; flex-direction: column; gap: 3px; }
    .sources li { font-size: 0.82rem; color: var(--text-2); }
    .sources .t { color: var(--muted); font-size: 0.76rem; margin-right: 6px; }
    details summary { cursor: pointer; font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
    .foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; border-top: 1px solid var(--line); padding-top: 10px; }
    .foot .count { font-size: 0.78rem; color: var(--muted); }
    .actions { display: flex; gap: 6px; }
    .empty { grid-column: 1/-1; text-align: center; padding: 48px; color: var(--muted); }

    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.72); display: none; align-items: center; justify-content: center; z-index: 90; padding: 20px; }
    .modal.open { display: flex; }
    .modal-box { background: var(--card); border: 1px solid var(--line-2); border-radius: 12px; padding: 16px; max-width: 980px; width: 100%; }
    .modal-box canvas { width: 100%; height: auto; border-radius: 8px; display: block; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; flex-wrap: wrap; }

    .toast {
      position: fixed; bottom: 24px; right: 24px; background: #22c55e; color: #052e16; font-weight: 700;
      padding: 11px 18px; border-radius: 8px; display: none; z-index: 100;
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-inner">
      <div class="brand">
        <span class="brand-title">ModelPulse</span>
        <span class="brand-tag">AI model leaks &amp; launches, first</span>
        <span class="status" id="status"><span class="dot" id="status-dot"></span><span id="status-text">Loading…</span></span>
      </div>
      <div class="nav-actions">
        <button class="btn" onclick="refreshFeed()" id="refresh-btn">↻ Refresh</button>
        <a class="btn" href="https://x.com/StatsWire" target="_blank" rel="noopener">@StatsWire</a>
      </div>
    </div>
  </nav>

  <main class="container">
    <div class="summary" id="summary"></div>
    <section class="toolbar">
      <div class="tabs" id="tabs">
        <button class="tab active" data-tab="all">All</button>
        <button class="tab" data-tab="leak">🟠 Leaks</button>
        <button class="tab" data-tab="release">🟢 Releases</button>
        <button class="tab" data-tab="open">Open weights</button>
        <button class="tab" data-tab="unread" id="tab-unread">Unread</button>
      </div>
      <div class="tools">
        <select id="provider" aria-label="Provider"></select>
        <input type="search" id="search" placeholder="Search model, ID or codename…" />
        <button class="btn btn-sm" onclick="markAllRead()">✓ Mark read</button>
      </div>
    </section>
    <section class="feed" id="feed"></section>
  </main>
  <footer class="site-foot">
    <span>Developed by <a href="https://x.com/StatsWire" target="_blank" rel="noopener">@StatsWire</a> on X</span>
    <span>Sharing a card? Please credit <a href="https://x.com/StatsWire" target="_blank" rel="noopener">@StatsWire</a></span>
  </footer>

  <div class="modal" id="modal" onclick="if (event.target === this) closeShare()">
    <div class="modal-box">
      <canvas id="share-canvas" width="1600" height="900"></canvas>
      <div class="modal-actions">
        <button class="btn" onclick="closeShare()">Close</button>
        <button class="btn" onclick="copyText(SHARE_STORY)">Copy X text</button>
        <button class="btn" onclick="downloadShare()">Download PNG</button>
        <button class="btn btn-primary" onclick="copyShareImage()">Copy image</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    let FEED = { stories: [], cards: [] };
    let STORIES = [];
    let TAB = "all";
    let SHARE_STORY = null;
    const SEEN_KEY = "modelpulse_seen_story_ids_v1";
    const SITE = "siddiquiamir.github.io/model-tracker";

    const LOGOS = {
      google: `<svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>`,
      anthropic: `<svg viewBox="0 0 48 48"><rect width="48" height="48" rx="12" fill="#d97757"/><path d="M27.8 13h5.1l8.6 22h-5.3l-1.8-4.8h-8.5l-1.8 4.8H19l8.8-22zm-4.1 13.2h5.9L26.7 18l-3 8.2zM14.2 13h5.2l8.6 22h-5.3l-5.9-15.6L10.9 35H5.6l8.6-22z" fill="#141413"/></svg>`,
      openai: `<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="22" fill="#10a37f"/><path d="M24 12c6.6 0 12 5.4 12 12s-5.4 12-12 12-12-5.4-12-12 5.4-12 12-12zm0 5a7 7 0 100 14 7 7 0 000-14z" fill="#fff"/></svg>`,
    };
    const BADGES = {
      kimi: ["#06b6d4", "K"], minimax: ["#ec4899", "MM"], zai: ["#6366f1", "GLM"], nvidia: ["#76b900", "NV"],
      xai: ["#18181b", "xAI"], qwen: ["#7c3aed", "QW"], deepseek: ["#0284c7", "DS"], meta: ["#2563eb", "∞"],
      mistral: ["#f59e0b", "M"], cursor: ["#1e293b", "CU"], perplexity: ["#0ea5e9", "PX"],
      thinkingmachines: ["#8b5cf6", "TML"], microsoft: ["#0078d4", "MS"],
    };
    function logoSvg(slug, name) {
      if (LOGOS[slug]) return LOGOS[slug];
      const [bg, txt] = BADGES[slug] || ["#334155", (name || "AI").replace(/[^A-Za-z0-9]/g, "").slice(0, 2).toUpperCase() || "AI"];
      const fs = txt.length > 2 ? 15 : 19;
      return `<svg viewBox="0 0 48 48"><rect width="48" height="48" rx="12" fill="${bg}"/><text x="24" y="31" text-anchor="middle" fill="#fff" font-size="${fs}" font-weight="800" font-family="Segoe UI, Arial, sans-serif">${escapeHtml(txt)}</text></svg>`;
    }

    function escapeHtml(s) {
      return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function safeUrl(u) { return /^https?:\/\//i.test(u || "") ? u : ""; }
    function toast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg; t.style.display = "block";
      clearTimeout(toast._t); toast._t = setTimeout(() => { t.style.display = "none"; }, 2600);
    }
    const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    function fmtUTC(iso, withYear) {
      const d = new Date(iso);
      if (isNaN(d)) return "";
      const p = n => String(n).padStart(2, "0");
      return `${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]}${withYear ? " " + d.getUTCFullYear() : ""} · ${p(d.getUTCHours())}:${p(d.getUTCMinutes())} UTC`;
    }
    function ago(iso) {
      const m = Math.max(0, Math.round((Date.now() - new Date(iso)) / 60000));
      if (m < 60) return m <= 1 ? "just now" : `${m} min ago`;
      if (m < 48 * 60) return `${Math.round(m / 60)} h ago`;
      return `${Math.round(m / 1440)} d ago`;
    }
    const hoursAgo = iso => (Date.now() - new Date(iso)) / 3600000;
    const stageOf = s => s.kind === "leak" ? "leak" : (s.open_weights ? "open" : "release");
    const STAGE_LABEL = { leak: "LEAK", release: "RELEASED", open: "OPEN WEIGHTS" };

    // Older feeds (before story grouping) only have cards: show one story per card
    function storiesFromFeed(feed) {
      if (Array.isArray(feed.stories)) return feed.stories;
      return (feed.cards || []).filter(c => c.scanner !== "cert-transparency-snapshot").map(c => ({
        id: "story-" + c.id, kind: "leak", open_weights: c.category === "open-source", title: c.title,
        provider_slug: c.provider_slug, provider_name: "", detected_at: c.detected_at, updated_at: c.detected_at,
        first_source: (c.header || "").split(" · ")[0], lead: "", codenames: c.codenames || [],
        models: (c.models || []).map(m => ({ id: m.id, name: m.name })), source_count: 1,
        sources: [{ label: (c.header || "").split(" · ")[0], detected_at: c.detected_at, url: (c.links || [])[0]?.url || "" }],
        x_post_text: c.x_post_text || c.title,
      }));
    }

    function getSeen() {
      try { const raw = localStorage.getItem(SEEN_KEY); return raw ? new Set(JSON.parse(raw)) : null; } catch { return null; }
    }
    function saveSeen(set) { try { localStorage.setItem(SEEN_KEY, JSON.stringify([...set])); } catch {} }
    function markAllRead() { saveSeen(new Set(STORIES.map(s => s.id))); render(); toast("All stories marked as read"); }

    function storyHtml(s, idx, seen) {
      const stage = stageOf(s);
      const unread = seen && !seen.has(s.id);
      const ids = (s.models || []).slice(0, 8).map(m => `<span class="chip mono">${escapeHtml(m.id)}</span>`).join("");
      const moreIds = (s.models || []).length > 8 ? `<span class="chip more">+${s.models.length - 8}</span>` : "";
      const srcRow = src => {
        const url = safeUrl(src.url);
        const label = url ? `<a href="${escapeHtml(url)}" target="_blank" rel="noopener">${escapeHtml(src.label)}</a>` : escapeHtml(src.label);
        return `<li><span class="t">${escapeHtml(fmtUTC(src.detected_at))}</span>${label}</li>`;
      };
      const srcs = s.sources || [];
      const srcHtml = srcs.length > 1
        ? `<ol class="sources">${srcs.slice(0, 4).map(srcRow).join("")}</ol>` +
          (srcs.length > 4 ? `<details><summary>+${srcs.length - 4} more sources</summary><ol class="sources">${srcs.slice(4).map(srcRow).join("")}</ol></details>` : "")
        : "";
      const codenames = (s.codenames || []).length
        ? `<div class="codenames">${s.codenames.map(c => `<span class="codename" title="Token not found in any public model catalog">codename: ${escapeHtml(c)}</span>`).join("")}</div>` : "";
      return `
        <article class="story ${stage} ${unread ? "unread" : ""}">
          <div class="head">
            <div class="logo">${logoSvg(s.provider_slug, s.provider_name)}</div>
            <div style="min-width:0">
              <div class="meta">
                <span class="stage ${stage}">${STAGE_LABEL[stage]}</span>
                ${s.provider_name ? `<span>${escapeHtml(s.provider_name)}</span>·` : ""}
                <span title="${escapeHtml(fmtUTC(s.detected_at, true))}">${escapeHtml(ago(s.detected_at))}</span>
                ${unread ? `<span class="new-dot" title="Unread"></span>` : ""}
              </div>
              <div class="title">${escapeHtml(s.title)}</div>
              <div class="first">First spotted ${escapeHtml(fmtUTC(s.detected_at))} in <b>${escapeHtml(s.first_source)}</b></div>
              ${s.lead ? `<span class="lead">⏱ ${escapeHtml(s.lead)}</span>` : ""}
            </div>
          </div>
          ${codenames}
          ${ids || moreIds ? `<div class="ids">${ids}${moreIds}</div>` : ""}
          ${srcHtml}
          <div class="foot">
            <span class="count">${srcs.length} source${srcs.length === 1 ? "" : "s"}${s.updated_at && s.updated_at !== s.detected_at ? " · updated " + escapeHtml(ago(s.updated_at)) : ""}<br><span class="credit">Developed by <a href="https://x.com/StatsWire" target="_blank" rel="noopener">@StatsWire</a></span></span>
            <div class="actions">
              <button class="btn btn-sm" onclick="copyText(STORIES_VIEW[${idx}])">Copy X text</button>
              <button class="btn btn-sm btn-primary" onclick="openShare(${idx})">Share image</button>
            </div>
          </div>
        </article>`;
    }

    let STORIES_VIEW = [];
    function render() {
      let seen = getSeen();
      if (!seen && STORIES.length) {  // first visit: only the last 24h counts as unread
        seen = new Set(STORIES.filter(s => hoursAgo(s.updated_at || s.detected_at) > 24).map(s => s.id));
        saveSeen(seen);
      }
      const prov = document.getElementById("provider").value;
      const q = document.getElementById("search").value.trim().toLowerCase();
      STORIES_VIEW = STORIES.filter(s => {
        if (TAB === "leak" && s.kind !== "leak") return false;
        if (TAB === "release" && s.kind !== "release") return false;
        if (TAB === "open" && !s.open_weights) return false;
        if (TAB === "unread" && (!seen || seen.has(s.id))) return false;
        if (prov && (s.provider_name || "Other") !== prov) return false;
        if (!q) return true;
        const hay = [s.title, s.provider_name, s.first_source, ...(s.codenames || []), ...(s.models || []).map(m => m.id), ...(s.sources || []).map(x => x.label)].join(" ").toLowerCase();
        return hay.includes(q);
      });
      const unread = seen ? STORIES.filter(s => !seen.has(s.id)).length : 0;
      document.getElementById("tab-unread").textContent = `Unread (${unread})`;
      const feedEl = document.getElementById("feed");
      feedEl.innerHTML = STORIES_VIEW.length
        ? STORIES_VIEW.map((s, i) => storyHtml(s, i, seen)).join("")
        : `<div class="empty">Nothing here yet.</div>`;
    }

    function renderChrome() {
      const leaks = STORIES.filter(s => s.kind === "leak").length;
      const day = STORIES.filter(s => hoursAgo(s.updated_at || s.detected_at) <= 24).length;
      const srcCount = STORIES.reduce((n, s) => n + (s.sources || []).length, 0);
      document.getElementById("summary").innerHTML =
        `<b>${STORIES.length}</b> models tracked (last 21 days) · <b>${leaks}</b> leaks · <b>${STORIES.length - leaks}</b> releases · <b>${day}</b> active in 24h · ${srcCount} source sightings merged`;
      const counts = {};
      STORIES.forEach(s => { const p = s.provider_name || "Other"; counts[p] = (counts[p] || 0) + 1; });
      const sel = document.getElementById("provider");
      const cur = sel.value;
      sel.innerHTML = `<option value="">All providers</option>` + Object.entries(counts).sort((a, b) => b[1] - a[1])
        .map(([p, n]) => `<option value="${escapeHtml(p)}">${escapeHtml(p)} (${n})</option>`).join("");
      sel.value = counts[cur] ? cur : "";
      renderStatus();
    }

    function renderStatus() {
      if (!FEED.generated_at) return;
      const mins = (Date.now() - new Date(FEED.generated_at)) / 60000;
      document.getElementById("status-dot").className = "dot" + (mins > 45 ? " stale" : "");
      const n = FEED.stats?.sources_ok;
      document.getElementById("status-text").textContent = `Last sweep ${ago(FEED.generated_at)}${n ? ` · ${n} sources ok` : ""}`;
    }

    async function loadFeed() {
      const bust = Date.now();
      const urls = ["./data/feed.json?t=" + bust, "https://raw.githubusercontent.com/siddiquiamir/model-tracker/main/docs/data/feed.json?t=" + bust];
      const results = await Promise.allSettled(urls.map(u => fetch(u, { cache: "no-store" }).then(r => r.ok ? r.json() : null)));
      const feeds = results.filter(r => r.status === "fulfilled" && r.value && (r.value.stories || r.value.cards)).map(r => r.value);
      if (!feeds.length) return;
      // Prefer a story-format feed, then the freshest one
      feeds.sort((a, b) => (!!b.stories - !!a.stories) || (new Date(b.generated_at || 0) - new Date(a.generated_at || 0)));
      FEED = feeds[0];
      STORIES = storiesFromFeed(FEED).sort((a, b) => new Date(b.detected_at) - new Date(a.detected_at));
      renderChrome();
      render();
    }
    async function refreshFeed() {
      const btn = document.getElementById("refresh-btn");
      btn.disabled = true;
      await loadFeed();
      btn.disabled = false;
      toast("Feed refreshed");
    }

    function copyText(s) {
      if (!s) return;
      navigator.clipboard.writeText(s.x_post_text || s.title).then(() => toast("X post text copied"), () => toast("Clipboard blocked"));
    }

    /* ---------- 1600x900 share image (X / Twitter 16:9) ---------- */
    function loadSvgImage(svg) {
      return new Promise(resolve => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => resolve(null);
        const withNs = svg.replace("<svg ", '<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" ');
        img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(withNs);
      });
    }
    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
    }
    function fitFont(ctx, text, weight, maxSize, minSize, maxWidth, family) {
      let size = maxSize;
      while (size > minSize) {
        ctx.font = `${weight} ${size}px ${family}`;
        if (ctx.measureText(text).width <= maxWidth) break;
        size -= 4;
      }
      return size;
    }
    function ellipsize(ctx, text, maxWidth) {
      if (ctx.measureText(text).width <= maxWidth) return text;
      while (text.length > 1 && ctx.measureText(text + "…").width > maxWidth) text = text.slice(0, -1);
      return text + "…";
    }

    async function drawShare(s) {
      const W = 1600, H = 900, PAD = 96;
      const SANS = '"Segoe UI", Inter, -apple-system, Roboto, Arial, sans-serif';
      const MONO = 'ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace';
      const stage = stageOf(s);
      const color = { leak: "#f59e0b", release: "#22c55e", open: "#a78bfa" }[stage];
      const canvas = document.getElementById("share-canvas");
      const ctx = canvas.getContext("2d");

      ctx.fillStyle = "#0b0d11"; ctx.fillRect(0, 0, W, H);
      const glow = ctx.createRadialGradient(W - 200, 120, 40, W - 200, 120, 900);
      glow.addColorStop(0, color + "33"); glow.addColorStop(1, "#0b0d1100");
      ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = color; ctx.fillRect(0, 0, 14, H);

      // Header: logo + provider, stage pill
      const logo = await loadSvgImage(logoSvg(s.provider_slug, s.provider_name));
      if (logo) ctx.drawImage(logo, PAD, 78, 88, 88);
      ctx.fillStyle = "#cbd5e1"; ctx.font = `600 40px ${SANS}`; ctx.textBaseline = "middle";
      ctx.fillText(s.provider_name || "New model", PAD + (logo ? 112 : 0), 122);
      const pill = STAGE_LABEL[stage];
      ctx.font = `800 34px ${SANS}`;
      const pw = ctx.measureText(pill).width + 64;
      roundRect(ctx, W - PAD - pw, 92, pw, 62, 31);
      ctx.fillStyle = color + "26"; ctx.fill(); ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.stroke();
      ctx.fillStyle = color; ctx.textAlign = "center"; ctx.fillText(pill, W - PAD - pw / 2, 124); ctx.textAlign = "left";

      // Title
      const size = fitFont(ctx, s.title, 800, 132, 64, W - PAD * 2, SANS);
      ctx.font = `800 ${size}px ${SANS}`; ctx.fillStyle = "#ffffff"; ctx.textBaseline = "alphabetic";
      ctx.fillText(ellipsize(ctx, s.title, W - PAD * 2), PAD, 200 + size);
      let y = 200 + size + 34;

      // Codename badges
      if ((s.codenames || []).length) {
        let x = PAD;
        ctx.font = `800 28px ${SANS}`; ctx.textBaseline = "middle";
        for (const c of s.codenames.slice(0, 3)) {
          const t = "CODENAME: " + c.toUpperCase();
          const w = ctx.measureText(t).width + 40;
          roundRect(ctx, x, y, w, 50, 25); ctx.fillStyle = "#fbbf24"; ctx.fill();
          ctx.fillStyle = "#1a1205"; ctx.fillText(t, x + 20, y + 26);
          x += w + 14;
        }
        y += 74;
      } else {
        y += 14;
      }

      // Stat columns
      const leadMatch = (s.lead || "").match(/^(.+?) (before .+)$/);
      const cols = [
        ["FIRST SPOTTED", fmtUTC(s.detected_at, false), "in " + (s.first_source || "")],
        ["CONFIRMED BY", `${(s.sources || []).length} source${(s.sources || []).length === 1 ? "" : "s"}`,
          (s.sources || []).slice(1, 3).map(x => x.label).join(", ") || "single source"],
      ];
      if (leadMatch) cols.push(["AHEAD BY", leadMatch[1], leadMatch[2]]);
      const colW = (W - PAD * 2) / cols.length;
      ctx.textBaseline = "alphabetic";
      cols.forEach(([label, value, sub], i) => {
        const x = PAD + i * colW;
        ctx.fillStyle = "#8b95a7"; ctx.font = `700 30px ${SANS}`; ctx.fillText(label, x, y + 30);
        ctx.fillStyle = i === 2 ? "#4ade80" : "#f1f5f9";
        ctx.font = `700 ${fitFont(ctx, value, 700, 56, 40, colW - 30, SANS)}px ${SANS}`;
        ctx.fillText(ellipsize(ctx, value, colW - 30), x, y + 98);
        ctx.fillStyle = "#a3adbd"; ctx.font = `500 32px ${SANS}`;
        ctx.fillText(ellipsize(ctx, sub, colW - 30), x, y + 146);
      });
      y += 200;

      // Identifier chips
      ctx.font = `500 32px ${MONO}`; ctx.textBaseline = "middle";
      let x = PAD;
      const ids = (s.models || []).map(m => m.id);
      for (let i = 0; i < ids.length && y < H - 160; i++) {
        const t = ids[i].length > 40 ? ids[i].slice(0, 39) + "…" : ids[i];
        const w = ctx.measureText(t).width + 36;
        if (x + w > W - PAD) {
          const rest = `+${ids.length - i}`;
          roundRect(ctx, x, y, ctx.measureText(rest).width + 36, 58, 10); ctx.fillStyle = "#1f2430"; ctx.fill();
          ctx.fillStyle = "#8b95a7"; ctx.fillText(rest, x + 18, y + 30);
          break;
        }
        roundRect(ctx, x, y, w, 58, 10); ctx.fillStyle = "#1f2430"; ctx.fill();
        ctx.strokeStyle = "#323948"; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = "#e2e8f0"; ctx.fillText(t, x + 18, y + 30);
        x += w + 14;
      }

      // Footer
      ctx.fillStyle = "#252a35"; ctx.fillRect(PAD, H - 108, W - PAD * 2, 2);
      ctx.textBaseline = "middle";
      ctx.fillStyle = "#8b95a7"; ctx.font = `500 28px ${SANS}`;
      ctx.fillText(`ModelPulse · ${SITE}`, PAD, H - 56);
      ctx.font = `800 38px ${SANS}`; ctx.textAlign = "right";
      const handleW = ctx.measureText("@StatsWire").width;
      ctx.fillStyle = "#ffffff"; ctx.fillText("@StatsWire", W - PAD, H - 56);
      ctx.fillStyle = "#8b95a7"; ctx.font = `500 28px ${SANS}`;
      ctx.fillText("Developed by ", W - PAD - handleW, H - 56); ctx.textAlign = "left";

      // Watermark over everything, so a crop or edit can't remove it
      ctx.save();
      ctx.globalAlpha = 0.06; ctx.fillStyle = "#ffffff"; ctx.font = `800 44px ${SANS}`;
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.translate(W / 2, H / 2); ctx.rotate(-Math.PI / 9);
      for (let row = -6; row <= 6; row++) {
        for (let col = -4; col <= 4; col++) {
          ctx.fillText("@StatsWire", col * 420 + (row % 2 ? 210 : 0), row * 140);
        }
      }
      ctx.restore();
      return canvas;
    }

    async function openShare(idx) {
      SHARE_STORY = STORIES_VIEW[idx];
      if (!SHARE_STORY) return;
      await drawShare(SHARE_STORY);
      document.getElementById("modal").classList.add("open");
    }
    function closeShare() { document.getElementById("modal").classList.remove("open"); }
    function shareFileName() { return `ModelPulse-${String(SHARE_STORY?.title || "model").replace(/[^a-zA-Z0-9._-]+/g, "-")}.png`; }
    function downloadShare() {
      const a = document.createElement("a");
      a.download = shareFileName();
      a.href = document.getElementById("share-canvas").toDataURL("image/png");
      a.click();
    }
    async function copyShareImage() {
      try {
        const blob = await new Promise(r => document.getElementById("share-canvas").toBlob(r, "image/png"));
        await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
        toast("Image copied: paste it into X");
      } catch (e) {
        toast("Clipboard image not supported here: use Download PNG");
      }
    }

    document.getElementById("tabs").addEventListener("click", e => {
      const btn = e.target.closest(".tab");
      if (!btn) return;
      TAB = btn.dataset.tab;
      document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t === btn));
      render();
    });
    document.getElementById("provider").addEventListener("change", render);
    document.getElementById("search").addEventListener("input", render);
    document.addEventListener("keydown", e => { if (e.key === "Escape") closeShare(); });
    setInterval(renderStatus, 30000);
    setInterval(loadFeed, 300000);
    loadFeed();
  </script>
</body>
</html>
