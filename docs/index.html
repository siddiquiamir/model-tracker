<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ModelPulse · AI model leaks & launches, first</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0e1014;
      --card: #181B20;
      --card-2: #292D34;
      --line: #414750;
      --line-2: #525965;
      --text: #FFFFFF;
      --text-2: #F4F6FA;
      --muted: #A4ADB9;
      --blue: #B9D5F5;
      --leak: #fce081;
      --release: #22c55e;
      --open: #a78bfa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
      min-height: 100vh;
      padding-bottom: 60px;
    }
    /* Full-screen tiled @StatsWire watermark overlay */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 40;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='125'><text x='14' y='72' transform='rotate(-22 110 62)' font-family='Inter,Segoe UI,Arial,sans-serif' font-size='15' font-weight='700' fill='%23ffffff' fill-opacity='0.055'>@StatsWire</text></svg>");
      background-repeat: repeat;
    }
    a { color: var(--blue); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

    .navbar {
      position: sticky; top: 0; z-index: 50;
      background: rgba(11, 13, 17, 0.9); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line); padding: 12px 24px;
    }
    .nav-inner, .container { max-width: 1180px; margin: 0 auto; }
    .nav-inner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-title { font-size: 1.2rem; font-weight: 800; letter-spacing: -0.02em; }
    .brand-tag { font-size: 0.85rem; color: var(--muted); }
    .status {
      display: inline-flex; align-items: center; gap: 8px; font-size: 0.8rem; color: var(--text-2);
      border: 1px solid var(--line-2); border-radius: 999px; padding: 4px 11px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--release); box-shadow: 0 0 8px var(--release); }
    .dot.stale { background: var(--leak); box-shadow: 0 0 8px var(--leak); }
    .nav-actions { display: flex; gap: 8px; align-items: center; }

    .btn {
      display: inline-flex; align-items: center; gap: 6px; font-size: 0.82rem; font-weight: 600;
      padding: 7px 13px; border-radius: 8px; border: 1px solid var(--line-2);
      background: var(--card); color: var(--text); cursor: pointer; text-decoration: none;
    }
    .btn:hover { background: var(--card-2); text-decoration: none; }
    .btn-primary { background: #2563eb; border-color: #3b82f6; color: #fff; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-sm { font-size: 0.76rem; padding: 5px 10px; border-radius: 6px; }

    .container { margin-top: 22px; padding: 0 24px; }
    .summary { color: var(--muted); font-size: 0.9rem; margin-bottom: 16px; }
    .summary b { color: var(--text); }

    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .tabs { display: flex; flex-wrap: wrap; gap: 6px; }
    .tab {
      font-size: 0.84rem; font-weight: 600; padding: 6px 13px; border-radius: 999px;
      border: 1px solid var(--line); background: var(--card); color: var(--text-2); cursor: pointer;
    }
    .tab:hover { color: #fff; border-color: var(--line-2); }
    .tab.active { background: var(--text); color: #0b0d11; border-color: var(--text); }
    .tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    select, input[type="search"] {
      background: var(--bg); color: var(--text); border: 1px solid var(--line-2);
      border-radius: 8px; padding: 7px 11px; font-size: 0.85rem; outline: none;
    }
    input[type="search"] { min-width: 240px; }
    select:focus, input:focus { border-color: var(--blue); }

    .feed { display: grid; grid-template-columns: repeat(auto-fill, minmax(520px, 1fr)); gap: 20px; align-items: start; }
    @media (max-width: 620px) { .feed { grid-template-columns: 1fr; } input[type="search"] { min-width: 0; width: 100%; } }

    .story {
      position: relative;
      background: #181B20;
      border: 1.25px solid rgba(255, 255, 255, 0.38);
      border-radius: 18px;
      padding: 24px 28px 20px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08), 0 16px 36px -10px rgba(0, 0, 0, 0.68);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .story:hover {
      border-color: rgba(255, 255, 255, 0.62);
    }
    /* Tiled credit so screenshots of a card always carry it */
    .story::before {
      content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='210' height='118'><text x='14' y='68' transform='rotate(-22 105 59)' font-family='Inter,Segoe UI,Arial,sans-serif' font-size='15' font-weight='700' fill='%23ffffff' fill-opacity='0.065'>@StatsWire</text></svg>");
    }
    .story > * { position: relative; }
    .site-foot { max-width: 1180px; margin: 36px auto 28px; padding: 18px 24px 0; border-top: 1px solid var(--line); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; font-size: 0.86rem; color: var(--muted); }
    .site-foot a { color: var(--text); font-weight: 700; text-decoration: none; }
    .head { display: flex; gap: 14px; align-items: center; }
    .logo {
      width: 46px; height: 46px; flex-shrink: 0; border-radius: 12px;
      background: #292D34; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    .logo svg { width: 46px; height: 46px; display: block; }
    .title {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 22px; font-weight: 600; letter-spacing: -0.015em; color: #FFFFFF;
      line-height: 1.25; word-break: break-word; display: inline-block; text-decoration: none;
    }
    a.title:hover { color: #B9D5F5; text-decoration: none; }
    .subtitle {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 12px; font-weight: 400; color: #A4ADB9; margin-top: 3px;
    }
    .divider { height: 1px; background: #414750; border: 0; margin: 18px 0; width: 100%; }
    .field-label {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 11px; font-weight: 500; letter-spacing: 0.05em;
      text-transform: uppercase; color: #A4ADB9;
    }
    .ids-wrap { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; align-items: center; }
    .chip, .chip.price {
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 14px; font-weight: 500; background: #181B20;
      border: 1px solid #414750; color: #F4F6FA;
      padding: 7px 14px; border-radius: 8px;
      overflow-wrap: anywhere; white-space: normal;
    }
    .meta-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      row-gap: 18px; column-gap: 28px; margin-top: 20px;
    }
    .field-value {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px; font-weight: 400; color: #FFFFFF; margin-top: 4px;
      line-height: 1.4;
    }
    .field-value a { color: #FFFFFF; text-decoration: none; }
    .field-value a:hover { color: #B9D5F5; text-decoration: underline; }
    .story { min-width: 0; }
    details summary { cursor: pointer; font-size: 12px; color: #A4ADB9; margin-top: 8px; }
    .foot {
      display: flex; justify-content: space-between; align-items: flex-end;
      gap: 12px; flex-wrap: wrap;
    }
    .evidence-summary {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 12px; font-weight: 400; color: #A4ADB9; margin-top: 4px; line-height: 1.4;
    }
    .credit-line {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px; font-weight: 400; color: #A4ADB9; margin-top: 8px;
    }
    .foot-right { display: flex; align-items: center; gap: 10px; margin-left: auto; }
    .watermark-link {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px; font-weight: 600; color: #B9D5F5; text-decoration: none;
    }
    .watermark-link:hover { text-decoration: underline; }
    .actions { display: flex; gap: 6px; }
    .empty { grid-column: 1/-1; text-align: center; padding: 48px; color: var(--muted); }

    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.72); display: none; align-items: center; justify-content: center; z-index: 90; padding: 20px; }
    .modal.open { display: flex; }
    .modal-box { background: var(--card); border: 1px solid var(--line-2); border-radius: 12px; padding: 16px; max-width: 980px; width: 100%; max-height: calc(100dvh - 40px); overflow-y: auto; }
    .modal-box canvas { width: 100%; height: auto; border-radius: 8px; display: block; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; flex-wrap: wrap; }

    .toast {
      position: fixed; bottom: 24px; right: 24px; background: #22c55e; color: #052e16; font-weight: 700;
      padding: 11px 18px; border-radius: 8px; display: none; z-index: 100;
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-inner">
      <div class="brand">
        <span class="brand-title">ModelPulse</span>
        <span class="brand-tag">AI model leaks &amp; launches, first</span>
        <span class="status" id="status"><span class="dot" id="status-dot"></span><span id="status-text">Loading…</span></span>
      </div>
      <div class="nav-actions">
        <button class="btn" onclick="refreshFeed()" id="refresh-btn">↻ Refresh</button>
        <a class="btn" href="https://x.com/StatsWire" target="_blank" rel="noopener">Developed by @StatsWire on X</a>
      </div>
    </div>
  </nav>

  <main class="container">
    <div class="summary" id="summary"></div>
    <section class="toolbar">
      <div class="tabs" id="tabs">
        <button class="tab active" data-tab="all">All</button>
        <button class="tab" data-tab="leak">🟠 Leaks</button>
        <button class="tab" data-tab="release">🟢 Releases</button>
        <button class="tab" data-tab="open">Open weights</button>
        <button class="tab" data-tab="unread" id="tab-unread">Unread</button>
      </div>
      <div class="tools">
        <select id="provider" aria-label="Provider"></select>
        <input type="search" id="search" placeholder="Search model, ID or codename…" />
        <button class="btn btn-sm" onclick="markAllRead()">✓ Mark read</button>
      </div>
    </section>
    <section class="feed" id="feed"></section>
  </main>
  <footer class="site-foot">
    <span>Developed by <a href="https://x.com/StatsWire" target="_blank" rel="noopener">@StatsWire</a> on X</span>
    <span>Sharing a card? Please credit <a href="https://x.com/StatsWire" target="_blank" rel="noopener">@StatsWire</a></span>
  </footer>

  <div class="modal" id="modal" onclick="if (event.target === this) closeShare()">
    <div class="modal-box">
      <canvas id="share-canvas" width="1600" height="900"></canvas>
      <div class="modal-actions">
        <button class="btn" onclick="closeShare()">Close</button>
        <button class="btn" onclick="copyText(SHARE_STORY)">Copy X text</button>
        <button class="btn" onclick="downloadShare()">Download PNG</button>
        <button class="btn btn-primary" onclick="copyShareImage()">Copy image</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script src="./html-to-image.js"></script>
  <script>
    let FEED = { stories: [], cards: [] };
    let STORIES = [];
    let TAB = "all";
    let SHARE_STORY = null;
    const SEEN_KEY = "modelpulse_seen_story_ids_v1";
    const SITE = "siddiquiamir.github.io/model-tracker";

    const LOGOS = {
      google: `<svg viewBox="0 0 48 48"><rect width="48" height="48" rx="12" fill="#292D34"/><g transform="translate(8,8) scale(0.6667)"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></g></svg>`,
      anthropic: `<svg viewBox="0 0 48 48"><rect width="48" height="48" rx="12" fill="#d97757"/><path d="M27.8 13h5.1l8.6 22h-5.3l-1.8-4.8h-8.5l-1.8 4.8H19l8.8-22zm-4.1 13.2h5.9L26.7 18l-3 8.2zM14.2 13h5.2l8.6 22h-5.3l-5.9-15.6L10.9 35H5.6l8.6-22z" fill="#141413"/></svg>`,
      openai: `<svg viewBox="0 0 48 48"><rect width="48" height="48" rx="12" fill="#10a37f"/><g transform="translate(8,8) scale(1.3333)" fill="#ffffff"><path d="M22.282 9.821a5.985 5.985 0 0 0-.516-4.91 6.046 6.046 0 0 0-6.51-2.9A6.065 6.065 0 0 0 4.981 4.18a5.985 5.985 0 0 0-3.998 2.9 6.046 6.046 0 0 0 .743 7.097 5.98 5.98 0 0 0 .51 4.911 6.051 6.051 0 0 0 6.515 2.9A5.985 5.985 0 0 0 13.26 24a6.056 6.056 0 0 0 5.772-4.206 5.99 5.99 0 0 0 3.997-2.9 6.056 6.056 0 0 0-.747-7.073zM13.26 22.43a4.476 4.476 0 0 1-2.876-1.04l.141-.081 4.779-2.758a.795.795 0 0 0 .392-.681v-6.737l2.02 1.168a.071.071 0 0 1 .038.052v5.583a4.504 4.504 0 0 1-4.494 4.494zM3.6 18.304a4.47 4.47 0 0 1-.535-3.014l.142.085 4.783 2.759a.771.771 0 0 0 .78 0l5.843-3.369v2.332a.08.08 0 0 1-.033.062L9.74 19.95a4.5 4.5 0 0 1-6.14-1.646zM2.34 7.896a4.485 4.485 0 0 1 2.366-1.973V11.6a.766.766 0 0 0 .388.676l5.815 3.355-2.02 1.168a.076.076 0 0 1-.071 0l-4.83-2.786A4.504 4.504 0 0 1 2.34 7.872zm16.597 3.855l-5.833-3.387L15.119 7.2a.076.076 0 0 1 .071 0l4.83 2.791a4.494 4.494 0 0 1-.676 8.105v-5.678a.79.79 0 0 0-.407-.667zm2.01-3.023l-.141-.085-4.774-2.782a.776.776 0 0 0-.785 0L9.409 9.23V6.897a.066.066 0 0 1 .028-.061l4.83-2.787a4.5 4.5 0 0 1 6.68 4.66zm-12.64 4.135l-2.02-1.164a.08.08 0 0 1-.038-.057V6.075a4.5 4.5 0 0 1 7.375-3.453l-.142.08L8.704 5.46a.795.795 0 0 0-.393.681zm1.097-2.365l2.602-1.5 2.607 1.5v2.999l-2.597 1.5-2.607-1.5z"/></g></svg>`,
      microsoft: `<svg viewBox="0 0 48 48"><rect width="48" height="48" rx="12" fill="#292D34"/><rect x="11" y="11" width="12" height="12" fill="#F25022"/><rect x="25" y="11" width="12" height="12" fill="#7FBA00"/><rect x="11" y="25" width="12" height="12" fill="#00A4EF"/><rect x="25" y="25" width="12" height="12" fill="#FFB900"/></svg>`,
    };
    const BADGES = {
      kimi: ["#06b6d4", "K"], minimax: ["#ec4899", "MM"], zai: ["#6366f1", "GLM"], nvidia: ["#76b900", "NV"],
      xai: ["#18181b", "xAI"], qwen: ["#7c3aed", "QW"], deepseek: ["#0284c7", "DS"], meta: ["#0668E1", "∞"],
      mistral: ["#FA520F", "M"], cursor: ["#2563eb", "CU"], perplexity: ["#0ea5e9", "PX"],
      thinkingmachines: ["#8b5cf6", "TML"], microsoft: ["#0078d4", "MS"],
    };
    function logoSvg(slug, name) {
      if (LOGOS[slug]) return LOGOS[slug];
      const [bg, txt] = BADGES[slug] || ["#3b82f6", (name || "AI").replace(/[^A-Za-z0-9]/g, "").slice(0, 2).toUpperCase() || "AI"];
      const fs = txt.length > 2 ? 15 : 19;
      return `<svg viewBox="0 0 48 48"><rect width="48" height="48" rx="12" fill="${bg}"/><text x="24" y="31" text-anchor="middle" fill="#ffffff" font-size="${fs}" font-weight="800" font-family="Inter, Segoe UI, Arial, sans-serif">${escapeHtml(txt)}</text></svg>`;
    }

    function escapeHtml(s) {
      return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function safeUrl(u) { return /^https?:\/\//i.test(u || "") ? u : ""; }
    function toast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg; t.style.display = "block";
      clearTimeout(toast._t); toast._t = setTimeout(() => { t.style.display = "none"; }, 2600);
    }
    const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    function fmtUTC(iso, withYear) {
      const d = new Date(iso);
      if (isNaN(d)) return "";
      const p = n => String(n).padStart(2, "0");
      return `${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]}${withYear ? " " + d.getUTCFullYear() : ""} · ${p(d.getUTCHours())}:${p(d.getUTCMinutes())} UTC`;
    }
    function ago(iso) {
      const m = Math.max(0, Math.round((Date.now() - new Date(iso)) / 60000));
      if (m < 60) return m <= 1 ? "just now" : `${m} min ago`;
      if (m < 48 * 60) return `${Math.round(m / 60)} h ago`;
      return `${Math.round(m / 1440)} d ago`;
    }
    const hoursAgo = iso => (Date.now() - new Date(iso)) / 3600000;
    const stageOf = s => s.kind === "leak" ? "leak" : (s.open_weights ? "open" : "release");
    const STAGE_LABEL = { leak: "LEAK", release: "RELEASED", open: "OPEN WEIGHTS" };

    // Older feeds (before story grouping) only have cards: show one story per card
    function storiesFromFeed(feed) {
      if (Array.isArray(feed.stories)) return feed.stories.filter(s => !String(s.id || "").startsWith("story-ct-"));
      return (feed.cards || []).filter(c => c.scanner !== "cert-transparency" && c.scanner !== "cert-transparency-snapshot" && c.category !== "subdomain-ct").map(c => ({
        id: "story-" + c.id, kind: "leak", open_weights: c.category === "open-source", title: c.title,
        provider_slug: c.provider_slug, provider_name: "", detected_at: c.detected_at, updated_at: c.detected_at,
        first_source: (c.header || "").split(" · ")[0], lead: "", codenames: c.codenames || [],
        models: (c.models || []).map(m => ({ id: m.id, name: m.name })), source_count: 1,
        sources: [{ label: (c.header || "").split(" · ")[0], detected_at: c.detected_at, url: (c.links || [])[0]?.url || "" }],
        x_post_text: c.x_post_text || c.title,
      }));
    }

    function getSeen() {
      try { const raw = localStorage.getItem(SEEN_KEY); return raw ? new Set(JSON.parse(raw)) : null; } catch { return null; }
    }
    function saveSeen(set) { try { localStorage.setItem(SEEN_KEY, JSON.stringify([...set])); } catch {} }
    function markAllRead() { saveSeen(new Set(STORIES.map(s => s.id))); render(); toast("All stories marked as read"); }

    function evidenceFor(s) {
      const cardIds = new Set(s.card_ids || [s.id.replace(/^story-/, "")]);
      return (FEED.cards || []).filter(card => cardIds.has(card.id));
    }
    function modelsFor(s) {
      const originals = evidenceFor(s).flatMap(card => card.models || []);
      return (s.models || []).map(model => {
        const labeled = originals.find(original => original.id === model.id && /\(M\d+\)/.test(original.name || ""));
        return labeled || model;
      });
    }
    function formatPricingText(raw) {
      let s = String(raw || "").trim();
      if (!s) return "";
      s = s.replace(/\bper\s+1M\b(?!\s+tokens)/i, "per 1M tokens");
      s = s.replace(/\(\s*cache\s+(\$[0-9.]+)\s*\)/i, "($1 cached)");
      return s;
    }
    function modelChips(models, storyPricing) {
      const sp = formatPricingText(storyPricing);
      return models.map(model => {
        const rawId = String(model.id || "");
        const id = (rawId.startsWith("org:") || rawId.includes(" · ")) ? String(model.name || rawId) : rawId.replace(/^(?:chatgpt|openai|anthropic|google|vertex_ai|bedrock)\//i, "");
        const mp = formatPricingText(model.pricing);
        const pr = mp && mp !== sp ? `<code class="chip price mono">${escapeHtml(mp)}</code>` : "";
        return `<code class="chip mono">${escapeHtml(id)}</code>${pr}`;
      }).join("");
    }
    function subtitleKind(s) {
      const src = (s.first_source || "").toLowerCase();
      if (src.includes("pricing")) return "Official pricing sighting";
      if (src.includes("arena")) return "Arena model config sighting";
      if (src.includes("antigravity")) return "Desktop & ACP build sighting";
      if (src.includes("npm") || src.includes("sdk") || src.includes("git")) return "SDK & CLI build sighting";
      if (s.open_weights || src.includes("hugging")) return "Open-weight repository sighting";
      return s.kind === "leak" ? "Model registry sighting" : "Public model release";
    }
    function availabilityText(s) {
      if (s.kind === "leak") return "Not announced";
      if (s.open_weights) return "Open weights";
      return "Publicly available";
    }
    function evidenceSummaryText(s) {
      const cards = evidenceFor(s);
      const primary = cards.find(card => card.build_transition) || cards[0];
      const src = s.first_source || "Registry";
      if (primary && primary.build_transition && !primary.build_transition.startsWith("+")) {
        return `${src} · ${primary.build_transition}`;
      }
      return `${src} · Model identifier sighting`;
    }

    function storyHtml(s, idx, seen) {
      const stage = stageOf(s);
      const models = modelsFor(s);
      const formattedPrice = formatPricingText(s.pricing);
      const priceChip = formattedPrice ? `<code class="chip price mono">${escapeHtml(formattedPrice)}</code>` : "";
      const ids = `<div class="ids-wrap">${modelChips(models.slice(0, 6), s.pricing)}${priceChip}</div>`;
      const moreIds = models.length > 6 ? `<details><summary>+${models.length - 6} more identifiers</summary><div class="ids-wrap">${modelChips(models.slice(6), s.pricing)}</div></details>` : "";
      const srcs = s.sources || [];
      const primaryUrl = safeUrl((srcs[0] && srcs[0].url) || ((evidenceFor(s)[0]?.links || [])[0]?.url) || "");
      const titleEl = primaryUrl
        ? `<a class="title" href="${escapeHtml(primaryUrl)}" target="_blank" rel="noopener">${escapeHtml(s.title)}</a>`
        : `<div class="title">${escapeHtml(s.title)}</div>`;
      const sourceVal = primaryUrl
        ? `<a href="${escapeHtml(primaryUrl)}" target="_blank" rel="noopener">${escapeHtml(s.first_source || "Registry")}</a>`
        : escapeHtml(s.first_source || "Registry");
      const sightingNoun = s.kind === "leak" ? "registry sighting" : "source sighting";
      const countText = `${srcs.length || 1} ${sightingNoun}${(srcs.length || 1) === 1 ? "" : "s"}`;
      const subParts = [s.provider_name, subtitleKind(s)].filter(Boolean).join(" · ");
      return `
        <article class="story ${stage}">
          <div class="head">
            <div class="logo">${logoSvg(s.provider_slug, s.provider_name)}</div>
            <div style="min-width:0">
              ${titleEl}
              <div class="subtitle">${escapeHtml(subParts)}</div>
            </div>
          </div>
          <hr class="divider" />
          <div>
            <div class="field-label">${models.length > 1 ? "MODEL IDS" : "MODEL ID"}</div>
            ${ids}${moreIds}
          </div>
          <div class="meta-grid">
            <div>
              <div class="field-label">SOURCE</div>
              <div class="field-value">${sourceVal}</div>
            </div>
            <div>
              <div class="field-label">FIRST DETECTED</div>
              <div class="field-value">${escapeHtml(fmtUTC(s.detected_at))}</div>
            </div>
            <div>
              <div class="field-label">SOURCE COUNT</div>
              <div class="field-value">${escapeHtml(countText)}</div>
            </div>
            <div>
              <div class="field-label">AVAILABILITY</div>
              <div class="field-value">${escapeHtml(availabilityText(s))}</div>
            </div>
          </div>
          <hr class="divider" />
          <div class="foot">
            <div style="min-width:0">
              <div class="field-label">EVIDENCE</div>
              <div class="evidence-summary">${escapeHtml(evidenceSummaryText(s))}</div>
              <div class="credit-line">Developed by <a class="watermark-link" href="https://x.com/StatsWire" target="_blank" rel="noopener">@StatsWire</a> on X</div>
            </div>
            <div class="foot-right">
              <div class="actions">
                <button class="btn btn-sm" onclick="copyText(STORIES_VIEW[${idx}])">Copy X text</button>
                <button class="btn btn-sm btn-primary" onclick="openShare(${idx})">Share image</button>
              </div>
            </div>
          </div>
        </article>`;
    }

    let STORIES_VIEW = [];
    function render() {
      let seen = getSeen();
      if (!seen && STORIES.length) {  // first visit: only the last 24h counts as unread
        seen = new Set(STORIES.filter(s => hoursAgo(s.updated_at || s.detected_at) > 24).map(s => s.id));
        saveSeen(seen);
      }
      const prov = document.getElementById("provider").value;
      const q = document.getElementById("search").value.trim().toLowerCase();
      STORIES_VIEW = STORIES.filter(s => {
        if (TAB === "leak" && s.kind !== "leak") return false;
        if (TAB === "release" && s.kind !== "release") return false;
        if (TAB === "open" && !s.open_weights) return false;
        if (TAB === "unread" && (!seen || seen.has(s.id))) return false;
        if (prov && (s.provider_name || "Other") !== prov) return false;
        if (!q) return true;
        const hay = [s.title, s.provider_name, s.first_source, s.pricing, ...(s.codenames || []), ...modelsFor(s).flatMap(model => [model.id, model.name, model.pricing]), ...evidenceFor(s).map(card => card.build_transition), ...(s.sources || []).map(x => x.label)].join(" ").toLowerCase();
        return hay.includes(q);
      });
      const unread = seen ? STORIES.filter(s => !seen.has(s.id)).length : 0;
      document.getElementById("tab-unread").textContent = `Unread (${unread})`;
      const feedEl = document.getElementById("feed");
      feedEl.innerHTML = STORIES_VIEW.length
        ? STORIES_VIEW.map((s, i) => storyHtml(s, i, seen)).join("")
        : `<div class="empty">Nothing here yet.</div>`;
    }

    function renderChrome() {
      const leaks = STORIES.filter(s => s.kind === "leak").length;
      const day = STORIES.filter(s => hoursAgo(s.updated_at || s.detected_at) <= 24).length;
      const srcCount = STORIES.reduce((n, s) => n + (s.sources || []).length, 0);
      document.getElementById("summary").innerHTML =
        `<b>${STORIES.length}</b> models tracked (last 21 days) · <b>${leaks}</b> leaks · <b>${STORIES.length - leaks}</b> releases · <b>${day}</b> active in 24h · ${srcCount} source sightings merged`;
      const counts = {};
      STORIES.forEach(s => { const p = s.provider_name || "Other"; counts[p] = (counts[p] || 0) + 1; });
      const sel = document.getElementById("provider");
      const cur = sel.value;
      sel.innerHTML = `<option value="">All providers</option>` + Object.entries(counts).sort((a, b) => b[1] - a[1])
        .map(([p, n]) => `<option value="${escapeHtml(p)}">${escapeHtml(p)} (${n})</option>`).join("");
      sel.value = counts[cur] ? cur : "";
      renderStatus();
    }

    let HEARTBEAT = null;
    async function loadHeartbeat() {
      try {
        const r = await fetch("https://raw.githubusercontent.com/siddiquiamir/model-tracker/status/status.json?t=" + Date.now(), { cache: "no-store" });
        if (!r.ok) return false;
        const heartbeat = await r.json();
        if (!Number.isFinite(Date.parse(heartbeat.last_scan))) return false;
        if (!HEARTBEAT || Date.parse(heartbeat.last_scan) >= Date.parse(HEARTBEAT.last_scan)) HEARTBEAT = heartbeat;
        return true;
      } catch {
        return false;
      } finally {
        renderStatus();
      }
    }
    function latestScanTime() {
      return Math.max(Date.parse(HEARTBEAT?.last_scan) || 0, Date.parse(FEED.generated_at) || 0);
    }
    function renderStatus() {
      const hb = HEARTBEAT && HEARTBEAT.last_scan && new Date(HEARTBEAT.last_scan) > new Date(FEED.generated_at || 0) ? HEARTBEAT : null;
      const last = hb ? hb.last_scan : FEED.generated_at;
      if (!last) return;
      const mins = (Date.now() - new Date(last)) / 60000;
      document.getElementById("status-dot").className = "dot" + (mins > 15 ? " stale" : "");
      const n = hb ? hb.sources_ok : FEED.stats?.sources_ok;
      document.getElementById("status-text").textContent = `Last scan ${ago(last)}${n ? ` · ${n} sources ok` : ""}`;
      document.getElementById("status-text").title = `Recorded scan time: ${fmtUTC(last, true)}. Refresh checks for updates; it does not start a scan.`;
    }

    async function loadFeed() {
      const bust = Date.now();
      const urls = [
        "https://raw.githubusercontent.com/siddiquiamir/model-tracker/status/feed.json?t=" + bust,
        "https://raw.githubusercontent.com/siddiquiamir/model-tracker/main/docs/data/feed.json?t=" + bust,
        "./data/feed.json?t=" + bust,
      ];
      const results = await Promise.allSettled(urls.map(u => fetch(u, { cache: "no-store" }).then(r => r.ok ? r.json() : null)));
      const feeds = results.filter(r => r.status === "fulfilled" && r.value && (Array.isArray(r.value.stories) || Array.isArray(r.value.cards))).map(r => r.value);
      if (!feeds.length) return false;
      // Prefer a story-format feed, then the freshest one
      feeds.sort((a, b) => (!!b.stories - !!a.stories) || (new Date(b.generated_at || 0) - new Date(a.generated_at || 0)));
      FEED = feeds[0];
      STORIES = storiesFromFeed(FEED).sort((a, b) => new Date(b.detected_at) - new Date(a.detected_at));
      renderChrome();
      render();
      return true;
    }
    async function refreshFeed() {
      const btn = document.getElementById("refresh-btn");
      const previousScan = latestScanTime();
      btn.disabled = true;
      try {
        const [loaded, heartbeatLoaded] = await Promise.all([loadFeed(), loadHeartbeat()]);
        if (!loaded) toast("Refresh failed; showing the previous feed");
        else if (!heartbeatLoaded) toast("Feed refreshed; scan status unavailable");
        else toast(latestScanTime() > previousScan ? "Feed refreshed; newer scan found" : "Latest data checked; no newer scan yet");
      } catch {
        toast("Refresh failed; showing the previous feed");
      } finally {
        btn.disabled = false;
      }
    }

    function shareText(s) {
      const weight = text => Array.from(text).reduce((total, char) => total + (char.codePointAt(0) > 127 ? 2 : 1), 0);
      let headline = `${s.kind === "leak" ? "LEAK" : "NEW"}: ${s.title}${s.provider_name ? " by " + s.provider_name : ""}`;
      if (weight(headline) > 130) {
        const chars = Array.from(headline);
        while (weight(chars.join("")) > 127) chars.pop();
        headline = chars.join("") + "...";
      }
      const lines = [headline, `First spotted ${fmtUTC(s.detected_at)}`];
      const credit = "Developed by @StatsWire on X";
      const sourceCount = (s.sources || []).length;
      const extras = [s.pricing ? "Pricing: " + s.pricing : "", s.first_source ? "Source: " + s.first_source : "", (s.codenames || []).length ? "Codename: " + s.codenames.join(", ") : "", `${sourceCount} source sighting${sourceCount === 1 ? "" : "s"}`, (s.models || []).length ? "IDs: " + s.models.map(model => model.id).join(", ") : ""];
      for (const extra of extras.filter(Boolean)) {
        if (weight([...lines, extra, credit].join("\n")) <= 280) lines.push(extra);
      }
      return [...lines, credit].join("\n");
    }
    function copyText(s) {
      if (!s) return;
      navigator.clipboard.writeText(shareText(s)).then(() => toast("X post text copied"), () => toast("Clipboard blocked"));
    }

    let sharePending = false;
    async function openShare(idx) {
      if (sharePending) return;
      const story = STORIES_VIEW[idx];
      const card = document.querySelectorAll(".story")[idx];
      if (!story || !card) return;
      sharePending = true;
      try {
        await document.fonts.ready;
        const snapshot = await htmlToImage.toCanvas(card, {
          pixelRatio: 2,
          skipFonts: true,
          filter: node => !(node.classList && node.classList.contains("actions")),
        });
        const canvas = document.getElementById("share-canvas");
        canvas.width = snapshot.width; canvas.height = snapshot.height;
        canvas.getContext("2d").drawImage(snapshot, 0, 0);
        canvas.style.maxWidth = snapshot.width / 2 + "px";
        canvas.style.margin = "0 auto";
        SHARE_STORY = story;
        document.getElementById("modal").classList.add("open");
      } catch {
        toast("Could not capture this card. Please try again.");
      } finally {
        sharePending = false;
      }
    }
    function closeShare() { document.getElementById("modal").classList.remove("open"); }
    function shareFileName() { return `ModelPulse-${String(SHARE_STORY?.title || "model").replace(/[^a-zA-Z0-9._-]+/g, "-")}.png`; }
    function downloadShare() {
      const a = document.createElement("a");
      a.download = shareFileName();
      a.href = document.getElementById("share-canvas").toDataURL("image/png");
      a.click();
    }
    async function copyShareImage() {
      try {
        const blob = await new Promise(r => document.getElementById("share-canvas").toBlob(r, "image/png"));
        await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
        toast("Image copied: paste it into X");
      } catch (e) {
        toast("Clipboard image not supported here: use Download PNG");
      }
    }

    document.getElementById("tabs").addEventListener("click", e => {
      const btn = e.target.closest(".tab");
      if (!btn) return;
      TAB = btn.dataset.tab;
      document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t === btn));
      render();
    });
    document.getElementById("provider").addEventListener("change", render);
    document.getElementById("search").addEventListener("input", render);
    document.addEventListener("keydown", e => { if (e.key === "Escape") closeShare(); });
    setInterval(renderStatus, 30000);
    setInterval(loadHeartbeat, 60000);
    setInterval(loadFeed, 60000);
    loadFeed().then(loadHeartbeat);
  </script>
</body>
</html>
