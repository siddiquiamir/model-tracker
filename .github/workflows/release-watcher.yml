name: ReleasePulse 24/7 Release Notes Watcher

# Watches official changelogs, releases & alpha PR diffs for:
#   - Google Antigravity (App, CLI, IDE, SDK, IDE Extensions)
#   - OpenAI Codex CLI (Stable + Alpha PR Radar compare)
#   - Anthropic Claude Code (CHANGELOG.md + npm dist-tags)
#   - Google Gemini CLI (google-gemini/gemini-cli)
#   - OpenCode (anomalyco/opencode)
#   - Cursor (cursor.com/changelog)
#   - MCP Specification (modelcontextprotocol/modelcontextprotocol)
# Archives 100% verbatim release notes, updates the live GitHub Pages Release Radar
# (docs/data/releases.json), renders a 16:9 @StatsWire PNG card, and posts to Discord
# with BOTH the PNG card inline AND the complete verbatim .md file attached.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      force_notify_latest:
        description: "Re-send Discord alerts for the latest release of every tracked tool"
        type: boolean
        default: false
      include_codex_alphas:
        description: "Include OpenAI Codex Alpha PR Radar compare track"
        type: boolean
        default: true

concurrency:
  group: release-watcher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch-releases:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow for @StatsWire PNG release cards
        run: pip install -q Pillow

      - name: Run release watcher unit tests
        run: python -m unittest tests/test_release_watcher.py -v

      - name: Check all coding agent & protocol releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RELEASE_DISCORD_WEBHOOK_URL: ${{ secrets.RELEASE_DISCORD_WEBHOOK_URL }}
          FORCE_NOTIFY_LATEST: ${{ inputs.force_notify_latest }}
          TRACK_CODEX_ALPHAS: ${{ inputs.include_codex_alphas }}
        run: |
          ARGS=""
          if [ "$FORCE_NOTIFY_LATEST" = "true" ]; then
            ARGS="$ARGS --force-notify-latest"
          fi
          if [ "$TRACK_CODEX_ALPHAS" = "false" ]; then
            ARGS="$ARGS --no-codex-alphas"
          fi
          python -m tracker.release_watcher $ARGS

      - name: Commit and push new verbatim release archives & Release Radar JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/release_state.json docs/data/releases.json releases/
          if git diff --cached --quiet; then
            echo "No new releases detected."
            exit 0
          fi

          # Avoid committing if only last_checked_at timestamp changed with zero new release files
          NEW_FILES=$(git diff --cached --name-only -- releases/ | wc -l)
          if [ "$NEW_FILES" -eq 0 ]; then
            echo "No new release files; skipping timestamp-only commit."
            git reset -q
            exit 0
          fi

          git commit -q -m "chore(releases): archive new agent & MCP releases"
          for attempt in 1 2 3; do
            if git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main; then
              echo "Pushed updated release archives & Release Radar feed."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "::warning::Failed to push release archives after 3 attempts."
          exit 1
