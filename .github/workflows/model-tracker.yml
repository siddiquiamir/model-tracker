name: ModelPulse Automated Diff Scanner

on:
  schedule:
    # Fastest cron interval supported by GitHub Actions (every 5 minutes)
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "docs/data/**"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scan-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache binary .rodata slices & npm metadata
        uses: actions/cache@v4
        with:
          path: .cache
          key: modelpulse-cache-${{ github.run_id }}
          restore-keys: |
            modelpulse-cache-

      - name: Run ModelPulse multi-source diff scan
        env:
          GITHUB_USER: ${{ github.repository_owner }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python server.py --scan

      - name: Commit updated model feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/data/feed.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(feed): update detected model diffs"
            git push
          fi
